name: Keep Work Buddy Awake
on:
  schedule:
    # Every 5 minutes (Render free sleeps after ~15 min with no external traffic)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping website
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /tmp/web.out -w "%{http_code}" --max-time 50 "https://work-buddy-1.onrender.com/health" || echo 000)
            echo "website attempt $i -> $code"
            if [ "$code" = "200" ] || [ "$code" = "304" ]; then exit 0; fi
            sleep 10
          done
          echo "website still not 200"
          exit 0
      - name: Ping bot health
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/bot.out -w "%{http_code}" --max-time 70 "https://work-buddy-2.onrender.com/health" || echo 000)
            echo "bot attempt $i -> $code"
            cat /tmp/bot.out 2>/dev/null || true
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 12
          done
          echo "bot still not 200 after retries"
          exit 0
